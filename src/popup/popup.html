<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Page Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <img src="../assets/icon.svg" alt="" width="38" height="38">
        <div>
          <h1>Smart Translator</h1>
          <p id="siteLabel">Current page</p>
        </div>
        <span class="activity-orb" aria-hidden="true"><i></i></span>
      </header>

      <section class="card">
        <label class="field" for="siteMode">
          <span>On this website</span>
          <select id="siteMode">
            <option value="auto">Follow language rules</option>
            <option value="always">Always translate</option>
            <option value="never">Never translate</option>
          </select>
        </label>

        <label class="field" for="targetLanguage">
          <span>Translate into</span>
          <select id="targetLanguage">
            <option value="ru">Russian</option>
            <option value="en">English</option>
            <option value="pt">Portuguese</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="nl">Dutch</option>
            <option value="uk">Ukrainian</option>
            <option value="pl">Polish</option>
          </select>
        </label>

        <div class="status" id="statusBox" data-tone="idle">
          <span class="status-dot"></span>
          <div>
            <strong id="statusTitle">Ready</strong>
            <p id="statusDetails">Enable translation for this website.</p>
          </div>
        </div>

        <div class="metrics" aria-label="Translation statistics">
          <div><strong id="translatedCount">0</strong><span>elements</span></div>
          <div><strong id="cacheHitCount">0</strong><span>cache hits</span></div>
          <div><strong id="apiItemCount">0</strong><span>API phrases</span></div>
        </div>
      </section>

      <div class="actions">
        <button id="translateButton" class="primary" type="button">Scan page again</button>
        <button id="settingsButton" class="secondary" type="button">Settings</button>
      </div>

      <p class="footnote"><span id="cacheEntries">0</span> translations saved locally</p>
    </main>
    <script src="../vendor/browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
